services:
  assetto-server:
    image: seejy/assetto-server-manager:latest
    container_name: assetto-corsa-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./assetto:/home/assetto/server-manager/assetto
      - ./config.yml:/home/assetto/server-manager/config.yml
      - ./data:/home/assetto/server-manager/data
      - ./entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
    entrypoint: [/entrypoint-wrapper.sh]
    environment:
      - TZ=America/Santo_Domingo
      - STEAM_USER=anonymous
      - STEAM_PASS=
      - STEAM_APP_ID=302550
